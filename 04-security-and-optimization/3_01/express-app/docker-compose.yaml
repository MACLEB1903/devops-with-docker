services:
  express-app:
    image: macleb1903/express-app
    container_name: express-app
    ports:
      - 8080:8080

  watchtower:
    image: nickfedor/watchtower
    container_name: watchtower
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: express-app
