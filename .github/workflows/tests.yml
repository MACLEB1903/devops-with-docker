name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-docker-basics/tests
    strategy:
      fail-fast: false
      matrix:
        script:
          - 02-docker-basics/test_1_07_curler.sh
          - 02-docker-basics/test_1_08_web_server.sh
          - 02-docker-basics/test_1_09_bind_mount_log.sh
          - 02-docker-basics/test_1_10_web_server_port.sh
          - 02-docker-basics/test_1_11_spring_example.sh
          - 02-docker-basics/test_1_12_frontend_port.sh
          - 02-docker-basics/test_1_13_backend_ping.sh
          - 02-docker-basics/test_1_14_frontend_backend_integration.sh
          - 02-docker-basics/test_1_15_or_1_16.sh
    steps:
      - uses: actions/checkout@v5

      # Playwright (used by the frontend-driving tests) requires Node 20+;
      # pin it explicitly instead of relying on the runner image's default.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Run ${{ matrix.script }}
        working-directory: tests
        run: bash ${{ matrix.script }}
