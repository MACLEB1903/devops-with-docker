name: Chapter 4 Exercises Tests

on:
  #    branches: ["main"]
  #    paths:
  #      - "/04-security-and-optimization/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-security-and-optimization
    outputs:
      tests: ${{ steps.list.outputs.tests }}
    steps:
      - uses: actions/checkout@v5

      - id: list
        run: |
          echo "tests=$(ls tests/test_*.sh | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_script: ${{ fromJson(needs.discover.outputs.tests) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run ${{ matrix.test_script }}
        run: bash "04-security-and-optimization/${{ matrix.test_script }}"
