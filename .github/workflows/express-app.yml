name: Build & Deploy Express App

on:
  push:
    branches: ["main"]
    paths:
      - 04-security-and-optimization/3_01/express-app/**
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/express-app
  RESOURCE_GROUP: express-app
  CONTAINER_APP: express-app

jobs:
  # Exercise 3.1 Your Pipeline
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log In to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: "./04-security-and-optimization/3_1/express-app/"
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # Exercise 3.2  Deployment Pipeline to a Cloud Service
  deploy-to-aca:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Log In to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp up -n express-app -g ${{ env.RESOURCE_GROUP }} \
            --image  docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
